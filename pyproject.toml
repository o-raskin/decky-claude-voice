[tool.pytest.ini_options]
testpaths = ["tests/py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "node_modules/*", ".venv/*", "dist/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
